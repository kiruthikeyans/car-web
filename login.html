<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: #FFFFFF; }
        .login-bg {
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.75), rgba(225, 6, 0, 0.25)),
                        url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(225, 6, 0, 0.2);
        }
        .input-field {
            background: rgba(26, 26, 26, 0.05);
            border: 2px solid rgba(26, 26, 26, 0.1);
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #E10600;
            background: rgba(26, 26, 26, 0.08);
        }
        .btn-red {
            background: linear-gradient(135deg, #E10600, #C50500);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-red:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(225, 6, 0, 0.3);
        }
        .btn-outline-red {
            border: 2px solid #E10600;
            color: #E10600;
            background: transparent;
            transition: all 0.3s ease;
        }
        .btn-outline-red:hover {
            background: rgba(225, 6, 0, 0.1);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="login-bg min-h-screen flex items-center justify-center px-4">
        <div class="glass rounded-2xl p-8 md:p-12 max-w-md w-full shadow-2xl animate-fade-in">
           
            <div class="text-center mb-8">
                <div class="flex items-center justify-center gap-2 mb-4">
                    <i class="fas fa-car text-[#E10600] text-3xl"></i>
                    <span class="text-3xl font-bold text-[#1A1A1A]">AutoVista</span>
                </div>
                <p class="text-gray-600">Premium Luxury Car Marketplace</p>
            </div>

        
            <h1 class="text-3xl font-bold text-center text-[#1A1A1A] mb-2">Welcome Back</h1>
            <p class="text-center text-gray-600 mb-8">Sign in to access your account</p>

    
            <form id="loginForm" class="space-y-5">
        
                <div>
                    <label class="block text-sm font-semibold text-[#1A1A1A] mb-2">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" class="w-full input-field rounded-lg px-4 py-3 outline-none" required />
                </div>

              
                <div>
                    <label class="block text-sm font-semibold text-[#1A1A1A] mb-2">Password</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full input-field rounded-lg px-4 py-3 outline-none" required />
                </div>

               
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded border-gray-300" />
                        <span class="text-gray-700">Remember me</span>
                    </label>
                    <a href="#" class="text-[#E10600] hover:text-[#C50500] font-semibold">Forgot password?</a>
                </div>

        
                <button type="submit" class="w-full btn-red rounded-lg py-3 font-bold text-lg">Sign In</button>
            </form>

            <div class="flex items-center gap-4 my-6">
                <div class="h-px bg-gray-300 flex-1"></div>
                <span class="text-gray-500 text-sm">or</span>
                <div class="h-px bg-gray-300 flex-1"></div>
            </div>

          
            <button class="w-full flex items-center justify-center gap-3 border-2 border-gray-300 rounded-lg py-3 font-semibold text-[#1A1A1A] hover:border-[#E10600] hover:bg-red-50 transition">
                <i class="fab fa-google text-red-600"></i>
                Continue with Google
            </button>

          
            <p class="text-center text-gray-700 mt-8">
                Don't have an account? 
                <a href="#" class="text-[#E10600] font-bold hover:underline">Create one</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (email && password) {
                localStorage.setItem('userEmail', email);
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
